<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #171a20;
    --muted: #5c5e62;
    --accent: #3e6ae1;          /* primary button color */
    --accent-dark: #3457b1;
    --line: #e2e4e8;
    --bar: 44px;                /* height of the news bar */
    --font: "Montserrat", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); color: var(--text); background: #fff; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  .scroller { position: relative; height: 100%; overflow-y: auto; scroll-behavior: smooth; }
  .scroller.snap { scroll-snap-type: y proximity; }
  @media (prefers-reduced-motion: reduce) { .scroller { scroll-behavior: auto; } }

  /* ---------- news carousel ---------- */
  .news {
    position: fixed; top: 0; left: 0; right: 0; z-index: 25;
    height: var(--bar); background: #171a20; color: #fff; overflow: hidden;
  }
  .news .viewport { height: 100%; margin: 0 44px; overflow: hidden; }
  .news .track { display: flex; height: 100%; will-change: transform; }
  .news .slide {
    flex: 0 0 100%; min-width: 0; height: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 6px; font-size: 13px; font-weight: 500; text-align: center; line-height: 1.3;
  }
  .news .slide .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .news .tag {
    flex: none; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px; background: var(--accent);
  }
  .news .more {
    flex: none; background: none; border: 0; cursor: pointer; color: #fff; opacity: .8;
    font-size: 13px; font-weight: 600; text-decoration: underline; padding: 4px 2px;
  }
  .news .more:hover { opacity: 1; }
  .news .arrow {
    position: absolute; top: 0; height: calc(var(--bar) - 2px); width: 44px;
    background: none; border: 0; cursor: pointer; color: #fff; opacity: .75; font-size: 22px; line-height: 1;
  }
  .news .arrow:hover { opacity: 1; }
  .news .prev { left: 0; } .news .next { right: 0; }
  .news .prog {
    position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
    background: rgba(255, 255, 255, .6); transform: scaleX(0); transform-origin: left;
  }
  .news .prog.run { animation: fill 5.5s linear forwards; }
  @keyframes fill { to { transform: scaleX(1); } }
  .news:hover .prog, .news:focus-within .prog { animation-play-state: paused; }
  @media (max-width: 560px) { .news .slide { font-size: 12px; gap: 6px; } .news .tag { display: none; } }

  /* ---------- nav ---------- */
  .nav {
    position: fixed; top: var(--bar); left: 0; right: 0; z-index: 20;
    height: 60px; padding: 0 clamp(14px, 2.5vw, 32px);
    display: flex; align-items: center; justify-content: space-between;
    color: var(--text); pointer-events: none; transition: color .25s;
  }
  .nav.light { color: #fff; }
  .nav > * { pointer-events: auto; }
  .logo {
    font-size: 17px; font-weight: 600; letter-spacing: .38em;
    background: none; border: 0; padding: 8px 10px; margin-left: -10px; cursor: pointer;
  }
  .links { display: none; gap: 4px; }
  @media (min-width: 960px) { .links { display: flex; } }
  .links button, .menu-btn {
    background: none; border: 0; cursor: pointer; font-size: 14px; font-weight: 500;
    padding: 6px 14px; border-radius: 4px; transition: background .2s;
  }
  .links button:hover, .menu-btn:hover { background: rgba(120, 120, 120, .22); }
  button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .news button:focus-visible { outline-color: #fff; }

  /* side menu */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 30; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .menu {
    position: fixed; top: 0; right: 0; height: 100%; width: min(340px, 100%);
    background: #fff; color: var(--text); padding: 16px 24px 24px;
    transform: translateX(100%); transition: transform .33s; z-index: 31; overflow-y: auto; visibility: hidden;
  }
  .menu.open { transform: none; visibility: visible; }
  .menu .top { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .menu .x { background: none; border: 0; cursor: pointer; font-size: 14px; font-weight: 500; padding: 6px 14px; border-radius: 4px; }
  .menu .x:hover, .menu li button:hover { background: #f4f4f4; }
  .menu ul { list-style: none; margin: 0; padding: 0; }
  .menu li button { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; font-size: 16px; font-weight: 500; padding: 12px; border-radius: 4px; }

  /* ---------- model sections ---------- */
  .model {
    position: relative; height: 100vh; min-height: 580px; scroll-snap-align: start; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: calc(var(--bar) + 60px + 5vh) 20px 9vh; text-align: center;
    background: var(--bgc, linear-gradient(180deg, #f6f7f8 0%, #e3e6ea 100%));
    color: var(--text);
  }
  .model[data-text="light"] { color: #fff; background: var(--bgc, linear-gradient(180deg, #2a2f36 0%, #101317 100%)); }
  .wm {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-30%);
    font-size: clamp(72px, 20vw, 250px); font-weight: 600; letter-spacing: -.02em; line-height: 1;
    color: transparent; -webkit-text-stroke: 2px rgba(0, 0, 0, .07);
    white-space: nowrap; overflow: hidden; pointer-events: none; user-select: none;
  }
  .model[data-text="light"] .wm { -webkit-text-stroke-color: rgba(255, 255, 255, .09); }
  /* the photo fades into the section color, so it looks full-bleed and the name always has clear space */
  .model .bgw {
    position: absolute; left: 0; right: 0; bottom: 0; height: 76%; z-index: 1;
    display: flex; justify-content: center; align-items: flex-end;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 24%);
  }
  .model .bgw .bg {
    display: block; height: 100%; width: auto; max-width: 100%; object-fit: contain;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 22%, #000 78%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 22%, #000 78%, transparent 100%);
  }
  @media (max-aspect-ratio: 1/1) {
    .model .bgw { height: 56%; bottom: 14%; align-items: center; -webkit-mask-image: none; mask-image: none; }
    .model .bgw .bg {
      width: 100%; height: auto; max-height: 100%;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%);
    }
  }
  .copy, .actions, .chev { position: relative; z-index: 2; }
  .copy h2 { margin: 0; font-size: clamp(28px, 4.2vw, 42px); font-weight: 500; letter-spacing: -.005em; }
  .copy p { margin: 8px 0 0; font-size: 15px; font-weight: 500; }
  .copy .from { margin-top: 4px; font-size: 13px; font-weight: 400; opacity: .8; }
  .actions { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 40px; min-width: min(264px, 82vw); padding: 0 24px;
    border: 3px solid transparent; border-radius: 4px;
    font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer;
    transition: background .33s, color .33s, border-color .33s;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn.secondary { background: rgba(244, 244, 244, .78); color: #393c41; }
  .btn.secondary:hover { background: #fff; }

  .chev {
    position: absolute; bottom: 2.4vh; left: 50%; margin-left: -10px; width: 20px; height: 20px; opacity: .65;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg) scale(.7); animation: bob 1.8s ease-in-out infinite; pointer-events: none;
  }
  @keyframes bob { 50% { transform: rotate(45deg) scale(.7) translate(4px, 4px); } }
  @media (prefers-reduced-motion: reduce) { .chev { animation: none; } }

  /* ---------- financing + footer ---------- */
  .fin {
    height: 100vh; min-height: 560px; scroll-snap-align: start;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: calc(var(--bar) + 60px) 24px 24px; position: relative; background: #fff;
  }
  .fin h2 { margin: 0 0 14px; font-size: clamp(28px, 4.2vw, 42px); font-weight: 500; }
  .fin p { margin: 0 auto 28px; max-width: 54ch; color: var(--muted); font-size: 15px; line-height: 1.7; }
  .fin .cols { display: flex; gap: clamp(24px, 6vw, 72px); flex-wrap: wrap; justify-content: center; margin: 4px 0 36px; }
  .fin .cols b { display: block; font-size: 32px; font-weight: 500; }
  .fin .cols span { font-size: 13px; color: var(--muted); }
  footer { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px; }

  /* ---------- popups (details + checkout) ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    padding: 16px; background: rgba(23, 26, 32, .55);
  }
  .overlay.open { display: flex; }
  .dialog {
    position: relative; width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto;
    background: #fff; color: var(--text); border-radius: 12px; padding: 32px 32px 28px; animation: pop .2s ease-out;
  }
  @keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dialog { animation: none; } }
  .dialog .hero { margin: -32px -32px 22px; background: #e9ecef; border-radius: 12px 12px 0 0; overflow: hidden; }
  .dialog .hero:empty { display: none; }
  .dialog .hero img { display: block; width: 100%; max-height: 240px; object-fit: cover; }
  .dialog .kind { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .dialog h3 { margin: 4px 0 12px; font-size: 30px; font-weight: 500; letter-spacing: -.01em; padding-right: 36px; }
  .dialog .body p { margin: 0 0 12px; color: #393c41; font-size: 15px; line-height: 1.7; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 20px 0 6px; padding-top: 20px; border-top: 1px solid var(--line); }
  .stats b { display: block; font-size: 26px; font-weight: 500; line-height: 1.1; }
  .stats span { font-size: 12px; color: var(--muted); }
  .dialog .btn { margin-top: 18px; width: 100%; }
  .close {
    position: absolute; top: 14px; right: 14px; z-index: 2; width: 36px; height: 36px;
    border-radius: 50%; border: 0; cursor: pointer; background: rgba(255, 255, 255, .92); font-size: 22px; line-height: 1;
  }
  .close:hover { background: #f0f1f3; }

  /* checkout */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 18px 0 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: #fff; border: 0; padding: 12px 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #171a20; color: #fff; }
  .rows { margin: 14px 0 0; }
  .rows .r { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .rows .r span:first-child { color: var(--muted); }
  .rows .r.big { font-size: 18px; font-weight: 600; border-bottom: 0; padding-top: 16px; }
  .rows .r.big span:first-child { color: var(--text); }
  .fine { margin: 12px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .note { margin: 14px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>

<div class="news" id="news" role="region" aria-roledescription="carousel" aria-label="Coil news">
  <button type="button" class="arrow prev" id="nPrev" aria-label="Previous news">&#8249;</button>
  <div class="viewport"><div class="track" id="nTrack"></div></div>
  <button type="button" class="arrow next" id="nNext" aria-label="Next news">&#8250;</button>
  <div class="prog" id="nProg"></div>
</div>

<nav class="nav" id="nav">
  <button type="button" class="logo" id="logo" aria-label="Coil, back to top"></button>
  <div class="links" id="links"></div>
  <button type="button" class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">Menu</button>
</nav>
<div class="scrim" id="scrim"></div>
<aside class="menu" id="menu" aria-label="Menu">

</aside>

<div class="scroller" id="scroller">
  <main id="sections"></main>

    <h2 id="finTitle"></h2>
    <p id="finText"></p>
    <div class="cols" id="finCols"></div>
    <a class="btn primary" id="finBtn" target="_blank" rel="noopener noreferrer"></a>
    <footer id="foot"></footer>
  </section>
</div>

<!-- details popup -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button type="button" class="close" id="mClose" aria-label="Close">&times;</button>
    <div class="hero" id="mHero"></div>
    <div class="kind" id="mKind"></div>
    <h3 id="mTitle"></h3>
    <div class="body" id="mBody"></div>
    <div class="stats" id="mStats"></div>
    <button type="button" class="btn primary" id="mOrder">Order Now</button>
  </div>
</div>

<!-- checkout popup -->
<div class="overlay" id="coOverlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <button type="button" class="close" id="cClose" aria-label="Close">&times;</button>
    <div class="hero" id="cHero"></div>
    <div class="kind">Checkout</div>
    <h3 id="cTitle"></h3>
    <div class="seg" id="cSeg" role="group" aria-label="Payment method">
      <button type="button" data-mode="full" aria-pressed="true">Pay in full</button>
      <button type="button" data-mode="finance" aria-pressed="false">Finance</button>
    </div>
    <div class="rows" id="cRows"></div>
    <p class="fine" id="cFine"></p>
    <a class="btn primary" id="cGo" target="_blank" rel="noopener noreferrer"></a>
    <p class="note" id="cNote"></p>
  </div>
</div>

  title: "Finance your Coil",
  text: "Following our partnership with Maze Bank, announced in July 2024, financing and leasing options are available on Coil vehicles, making it easier to drive one home.",

};

/* =====================================================
   2. CODE (no need to edit below)
   ===================================================== */
const $ = (id) => document.getElementById(id);
const scroller = $("scroller");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastFocus = null;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function resolveImg(url) {
  if (typeof url !== "string") return "";
  url = url.trim();
  const m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || url.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([\w-]+)/);
  if (m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w2000";
  return /^(https?:\/\/|data:image\/)/i.test(url) ? url : "";
}
function makeImg(src, cls, alt) {
  const i = document.createElement("img");
  if (cls) i.className = cls;
  i.src = src; i.alt = alt || "";
  i.addEventListener("error", () => { i.style.display = "none"; });
  return i;
}
function isLink(u) { return typeof u === "string" && /^https?:\/\//i.test(u.trim()); }
function goTo(id) {
  const t = $(id); if (!t) return;
  scroller.scrollTo({ top: t.offsetTop, behavior: "smooth" });
}
function slug(i) { return "m" + i; }
function targetId(name) {
  if (name === "financing") return "financing";
  const i = MODELS.findIndex(m => m.name.toLowerCase() === String(name).toLowerCase());
  return i >= 0 ? slug(i) : "";
}
const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
function monthly(price) {
  const P = price * (1 - FINANCE_TERMS.downPct / 100);
  const r = FINANCE_TERMS.apr / 100 / 12, n = FINANCE_TERMS.months;
  return r ? P * r / (1 - Math.pow(1 + r, -n)) : P / n;
}

/* ---------- news carousel ---------- */
const nTrack = $("nTrack"), nProg = $("nProg"), N = NEWS.length;
let nIdx = 0;
function slideEl(item) {
  const s = el("div", "slide");
  if (item.tag) s.appendChild(el("span", "tag", item.tag));
  s.appendChild(el("span", "t", item.text));
  const dest = targetId(item.goto || "");
  if (dest || isLink(item.link)) {
    const b = el("button", "more", "Learn more"); b.type = "button";
    b.addEventListener("click", () => { if (dest) goTo(dest); else window.open(item.link, "_blank", "noopener"); });
    s.appendChild(b);
  }
  return s;
}
NEWS.forEach(n => nTrack.appendChild(slideEl(n)));
if (N > 1) nTrack.appendChild(slideEl(NEWS[0])).setAttribute("aria-hidden", "true");   // copy of the first slide so it can loop smoothly
function nPos(i, anim) {
  nTrack.style.transition = anim && !reduceMotion ? "transform .6s ease" : "none";
  nTrack.style.transform = "translateX(" + (-i * 100) + "%)";
}
function nRestart() {
  nProg.classList.remove("run");
  if (N < 2 || reduceMotion) return;
  void nProg.offsetWidth;
  nProg.classList.add("run");
}
function nNextSlide() {
  if (N < 2) return;
  if (reduceMotion) { nIdx = (nIdx + 1) % N; nPos(nIdx, false); return; }
  if (nIdx >= N) return;
  nIdx++; nPos(nIdx, true);
}
function nPrevSlide() {
  if (N < 2) return;
  if (nIdx === 0) { nIdx = N; nPos(N, false); void nTrack.offsetWidth; }
  nIdx--; nPos(nIdx, !reduceMotion);
}
nTrack.addEventListener("transitionend", () => { if (nIdx === N) { nIdx = 0; nPos(0, false); } });
nProg.addEventListener("animationend", () => { nNextSlide(); nRestart(); });
$("nNext").addEventListener("click", () => { nNextSlide(); nRestart(); });
$("nPrev").addEventListener("click", () => { nPrevSlide(); nRestart(); });
if (N < 2) { $("nPrev").style.display = "none"; $("nNext").style.display = "none"; }
nRestart();

/* ---------- nav + menu ---------- */
$("logo").textContent = BRAND;
$("logo").addEventListener("click", () => scroller.scrollTo({ top: 0, behavior: "smooth" }));
document.title = BRAND.charAt(0) + BRAND.slice(1).toLowerCase();

const linkBox = $("links"), menuList = $("menuList");
const entries = MODELS.map((m, i) => [m.name, slug(i)]).concat([["Financing", "financing"]]);
entries.forEach(([label, id]) => {
  const b = el("button", "", label); b.type = "button";
  b.addEventListener("click", () => goTo(id));
  linkBox.appendChild(b);
  const li = el("li"), b2 = el("button", "", label); b2.type = "button";
  b2.addEventListener("click", () => { closeMenu(); goTo(id); });
  li.appendChild(b2); menuList.appendChild(li);
});
function openMenu() { $("menu").classList.add("open"); $("scrim").classList.add("open"); $("menuBtn").setAttribute("aria-expanded", "true"); $("menuClose").focus(); }
function closeMenu() { $("menu").classList.remove("open"); $("scrim").classList.remove("open"); $("menuBtn").setAttribute("aria-expanded", "false"); }
$("menuBtn").addEventListener("click", openMenu);
$("menuClose").addEventListener("click", closeMenu);
$("scrim").addEventListener("click", closeMenu);

/* ---------- model sections ---------- */
const host = $("sections");
MODELS.forEach((m, i) => {
  const s = el("section", "model"); s.id = slug(i);
  s.dataset.text = m.text === "light" ? "light" : "dark";
  const src = resolveImg(m.image);
  if (src && m.bgColor) s.style.setProperty("--bgc", m.bgColor);
  if (!src) s.appendChild(el("div", "wm", m.name));
  else { const w = el("div", "bgw"); w.appendChild(makeImg(src, "bg", m.imageAlt || m.name)); s.appendChild(w); }

  const copy = el("div", "copy");
  copy.appendChild(el("h2", "", m.name));
  if (m.tagline) copy.appendChild(el("p", "", m.tagline));
  if (m.price) copy.appendChild(el("p", "from", "From " + money(m.price)));
  s.appendChild(copy);

  const acts = el("div", "actions");
  const order = el("button", "btn primary", "Order Now"); order.type = "button";
  order.addEventListener("click", () => openCheckout(m, order));
  const more = el("button", "btn secondary", "Learn More"); more.type = "button";
  more.addEventListener("click", () => openPopup(m, more));
  acts.appendChild(order); acts.appendChild(more);
  s.appendChild(acts);

  if (i === 0) s.appendChild(el("div", "chev"));
  host.appendChild(s);
});

/* ---------- financing ---------- */
$("finTitle").textContent = FINANCE.title;
$("finText").textContent = FINANCE.text;
FINANCE.stats.forEach(([v, l]) => {
  const d = el("div"); d.appendChild(el("b", "", v)); d.appendChild(el("span", "", l)); $("finCols").appendChild(d);
});
if (isLink(FINANCE.buttonLink)) { $("finBtn").href = FINANCE.buttonLink; $("finBtn").textContent = FINANCE.buttonText || "Contact us"; }
else { $("finBtn").style.display = "none"; }
$("foot").textContent = "\u00A9 " + new Date().getFullYear() + " " + BRAND.charAt(0) + BRAND.slice(1).toLowerCase() + (FOOTER_TEXT ? " \u00B7 " + FOOTER_TEXT : "");

/* nav color follows the section under it */
const nav = $("nav");
const io = new IntersectionObserver((list) => {
  list.forEach(e => { if (e.isIntersecting) nav.classList.toggle("light", e.target.dataset.text === "light"); });
}, { root: scroller, threshold: 0.5 });
document.querySelectorAll(".model, .fin").forEach(s => io.observe(s));

/* start at the top, then turn on snapping (turning it on earlier made some browsers jump to the bottom) */
scroller.scrollTo({ top: 0, behavior: "instant" });
requestAnimationFrame(() => requestAnimationFrame(() => scroller.classList.add("snap")));

/* ---------- details popup ---------- */
const overlay = $("overlay");
let currentModel = null;
function openPopup(m, trigger) {
  currentModel = m; lastFocus = trigger;
  const hero = $("mHero"); hero.innerHTML = "";
  const src = resolveImg(m.image);
  if (src) hero.appendChild(makeImg(src, "", m.imageAlt || m.name));
  $("mKind").textContent = m.kind || ""; $("mKind").style.display = m.kind ? "" : "none";
  $("mTitle").textContent = m.name;
  const body = $("mBody"); body.innerHTML = "";
  (m.description || m.tagline || "").split(/\n\s*\n/).forEach(p => { if (p.trim()) body.appendChild(el("p", "", p.trim())); });
  const st = $("mStats"); st.innerHTML = "";
  const rows = (m.price ? [[money(m.price), "Starting price"]] : []).concat(m.stats || []).slice(0, 4);
  rows.forEach(([v, l]) => { const d = el("div"); d.appendChild(el("b", "", v)); d.appendChild(el("span", "", l)); st.appendChild(d); });
  st.style.display = rows.length ? "" : "none";
  overlay.classList.add("open"); overlay.setAttribute("aria-hidden", "false");
  $("mClose").focus();
}
function closePopup(restore) {
  overlay.classList.remove("open"); overlay.setAttribute("aria-hidden", "true");
  if (restore !== false && lastFocus) lastFocus.focus();
}
$("mClose").addEventListener("click", () => closePopup());
overlay.addEventListener("click", (e) => { if (e.target === overlay) closePopup(); });
$("mOrder").addEventListener("click", () => { const m = currentModel; closePopup(false); if (m) openCheckout(m, lastFocus); });

/* ---------- checkout ---------- */
const coOverlay = $("coOverlay");
let coModel = null, coMode = "full";
function renderCheckout() {
  const m = coModel, price = m.price || 0;
  const rows = $("cRows"); rows.innerHTML = "";
  const add = (a, b, big) => {
    const r = el("div", "r" + (big ? " big" : "")); r.appendChild(el("span", "", a)); r.appendChild(el("span", "", b)); rows.appendChild(r);
  };
  if (!price) {
    add("Price", "Contact us", true);
    $("cFine").textContent = "";
  } else if (coMode === "full") {
    add("Vehicle", m.name);
    add("Price", money(price));
    add("Due today", money(price), true);
    $("cFine").textContent = "";
  } else {
    const down = price * FINANCE_TERMS.downPct / 100;
    add("Vehicle", m.name);
    add("Price", money(price));
    add("Down payment (" + FINANCE_TERMS.downPct + "%)", money(down));
    add("Term", FINANCE_TERMS.months + " months at " + FINANCE_TERMS.apr + "% APR");
    add("Estimated payment", money(monthly(price)) + " / mo", true);
    $("cFine").textContent = FINANCE_TERMS.note || "";
  }
  document.querySelectorAll("#cSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === coMode)));
  $("cSeg").style.display = price ? "" : "none";
}
function openCheckout(m, trigger) {
  coModel = m; coMode = "full"; lastFocus = trigger;
  const hero = $("cHero"); hero.innerHTML = "";
  const src = resolveImg(m.image);
  if (src) hero.appendChild(makeImg(src, "", m.imageAlt || m.name));
  $("cTitle").textContent = m.name;
  const link = m.orderLink || ORDER_LINK, go = $("cGo");
  if (isLink(link)) { go.href = link; go.textContent = ORDER_TEXT || "Continue to order"; go.style.display = ""; $("cNote").textContent = ""; }
  else { go.style.display = "none"; $("cNote").textContent = "To complete your purchase, please contact Coil."; }
  renderCheckout();
  coOverlay.classList.add("open"); coOverlay.setAttribute("aria-hidden", "false");
  $("cClose").focus();
}
function closeCheckout() {
  coOverlay.classList.remove("open"); coOverlay.setAttribute("aria-hidden", "true");
  if (lastFocus) lastFocus.focus();
}
document.querySelectorAll("#cSeg button").forEach(b => b.addEventListener("click", () => { coMode = b.dataset.mode; renderCheckout(); }));
$("cClose").addEventListener("click", closeCheckout);
coOverlay.addEventListener("click", (e) => { if (e.target === coOverlay) closeCheckout(); });

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (coOverlay.classList.contains("open")) closeCheckout();
  else if (overlay.classList.contains("open")) closePopup();
  else closeMenu();
});
</script>
</body>
</html>
